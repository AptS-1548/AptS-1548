services:
  bot:
    build: .
    env_file: src/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - SURREALDB_URL=ws://surrealdb:8000
    volumes:
      - ./data/bot:/app/data
    depends_on:
      - qdrant
      - surrealdb
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant/storage:/qdrant/storage
      - ./data/qdrant/snapshots:/qdrant/snapshots
    restart: unless-stopped

  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start --user root --pass root surrealkv:/data/srdb.db
    ports:
      - "8000:8000"
    volumes:
      - ./data/surrealdb:/data
    restart: unless-stopped
