[project]
name = "apts-1548"
version = "0.1.0"
description = "AptS:1548 - 不是机器人，是人"
requires-python = ">=3.10"
dependencies = [
    "surrealdb>=1.0.8",
    "qdrant-client>=1.17.0",
    "httpx>=0.28.1",
    "sentence-transformers>=5.2.3",
    "anthropic>=0.84.0",
    "nonebot2[fastapi]>=2.4.4",
    "nonebot-adapter-onebot>=2.4.6",
    "torch>=2.0.0",
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.nonebot]
plugin_dirs = ["plugins"]
builtin_plugins = []

[tool.nonebot.plugins]
"@local" = []


[tool.nonebot.adapters]
"@local" = []
